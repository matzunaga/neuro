name: Refresh neurons
on:
  schedule:
    - cron: "17 11 * * 1"      # every Monday, picks a new set of cells
  workflow_dispatch:
  push:
    paths: ["scripts/fetch.py", ".github/workflows/update.yml"]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/fetch.py
      - name: Commit data
        run: |
          git config user.name "neuro-bot"
          git config user.email "neuro-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Refresh neurons" && git push
